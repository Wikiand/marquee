name: Encore CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - work/final-cut-error-logging
      - main
      - master

jobs:
  build-and-test:
    name: Build, test, lint and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test, lint and generate coverage
        run: mvn --batch-mode clean verify

      - name: Add coverage summary
        if: success()
        run: |
          set -euo pipefail

          REPORT="target/site/jacoco/jacoco.csv"

          if [ ! -s "$REPORT" ]; then
            echo "JaCoCo coverage report was not generated."
            exit 1
          fi

          awk -F, '
            NR > 1 {
              missed += $4
              covered += $5
            }
            END {
              total = missed + covered

              if (total > 0) {
                printf "## JaCoCo instruction coverage\n\n**Coverage: %.2f%%** (%d covered instructions out of %d)\n", covered * 100 / total, covered, total
              } else {
                print "No instruction coverage data found."
                exit 1
              }
            }
          ' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo HTML report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: encore-jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
